run_id: CosmosReason2-2B-PI-LIBERO
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: gaystarc-peking-university
wandb_project: LaST-HD
is_debug: false

framework:
  name: QwenPI
  qwenvl:
    base_vlm: /mnt/cpfs/guchenyang/Pretrained/Cosmos/Cosmos-Reason2-2B
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14

  action_model:
    action_model_type: DiT-B
    hidden_size: 2048
    action_hidden_dim: 2048
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 7
    action_horizon: 8
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/cpfs/guchenyang/Data/LIBERO
    data_mix: libero_all
    action_type: delta_ee
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 12
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: [224, 224]
    video_backend: torchvision_av
    include_state: true

trainer:
  epochs: 100
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 1e-05
    qwen_vl_interface: 1.0e-05
    # Lower action_model LR to reduce NaN risk when training longer (Cosmos 2B)
    action_model: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  # Stronger gradient clipping to avoid explosion/NaN
  gradient_clipping: 0.5
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
